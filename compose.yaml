name: kfcquant-research

x-research: &research
  image: ${KFCQUANT_IMAGE_REPOSITORY:-ghcr.io/dershine/kfcquantitative}:${KFCQUANT_IMAGE_TAG:-latest}
  env_file:
    - .env
  environment:
    KFCQUANT_DATABASE_PATH: /app/data/kfcquant.duckdb
    KFCQUANT_RAW_DATA_DIR: /app/data/raw
    KFCQUANT_REPORT_DIR: /app/reports
    KFCQUANT_RUNTIME_DIR: /app/runtime
    KFCQUANT_BACKUP_DIR: /app/backups
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  research-web:
    <<: *research
    command: ["kfcquant", "serve"]
    environment:
      KFCQUANT_DATABASE_PATH: /app/data/kfcquant.duckdb
      KFCQUANT_RAW_DATA_DIR: /app/data/raw
      KFCQUANT_REPORT_DIR: /app/reports
      KFCQUANT_RUNTIME_DIR: /app/runtime
      KFCQUANT_BACKUP_DIR: /app/backups
      KFCQUANT_DATABASE_READ_ONLY: "true"
      KFCQUANT_DATABASE_LOCK_TIMEOUT_SECONDS: "2"
      KFCQUANT_BASE_URL_PATH: research
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - /var/lib/kfcquant/data:/app/data:ro
      - /var/lib/kfcquant/reports:/app/reports:ro
      - /var/lib/kfcquant/runtime:/app/runtime
      - /var/lib/kfcquant/backups:/app/backups:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8501/research/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  research-worker:
    <<: *research
    command: ["kfcquant", "scheduler"]
    volumes:
      - /var/lib/kfcquant/data:/app/data
      - /var/lib/kfcquant/reports:/app/reports
      - /var/lib/kfcquant/runtime:/app/runtime
      - /var/lib/kfcquant/backups:/app/backups
    healthcheck:
      test: ["CMD", "kfcquant", "health", "--json"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
