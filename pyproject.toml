[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kfcquant"
version = "0.2.0"
description = "A-share pre-close research agent and auditable paper portfolio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11",
  "akshare>=1.17",
  "baostock>=0.9.3",
  "duckdb>=1.3",
  "fastapi>=0.116",
  "filelock>=3.18",
  "httpx>=0.28",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "numpy>=2.1",
  "openai>=1.90",
  "pandas>=2.2",
  "plotly>=6.0",
  "python-multipart>=0.0.20",
  "pyarrow>=19.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pypdf>=5.0",
  "pytz>=2025.2",
  "streamlit>=1.45",
  "tushare>=1.4",
  "typer>=0.15",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[project.scripts]
kfcquant = "kfcquant.cli:app"
kfcops = "kfcops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kfcops = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ", "FURB"]
# Integration boundaries deliberately catch provider/model failures so the
# workflow can fail closed or emit a degraded report instead of placing orders.
ignore = ["BLE001", "S110"]
