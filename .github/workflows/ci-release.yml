name: test-and-release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-build-isolation -e ".[dev]"
      - run: python -m pip check
      - run: ruff check src tests
      - run: python -m mypy
      - run: python -m bandit -r src -c pyproject.toml -lll
      - run: python scripts/scan_secrets.py --tracked
      - run: python -m pip_audit --strict --desc off --disable-pip --no-deps --requirement requirements.lock
      - run: pytest --cov=kfcquant --cov=kfcops

  package:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: kfcquant-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
